# 在 issue 或 PR 留言寫 @claude，AI 就會照 CLAUDE.md 與 .claude/skills 的規則動手做，完成後開 PR 給你審。
# 設定方式見 docs/AGENT-WORKFLOW.md
name: Claude 助理

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 先把測試工具裝好，AI 改完可以自己跑 npm test
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: 準備瀏覽器（優先用 GitHub 內建的 Chrome，不必另外下載）
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: cd cloud && npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          # 用 Claude API 金鑰：在倉庫 Settings → Secrets 新增 ANTHROPIC_API_KEY
          # 用 Claude 訂閱：改成 claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(ls:*),Bash(cat:*)"
