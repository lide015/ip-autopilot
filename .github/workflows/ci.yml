# 每次推送或開 PR 自動檢查：兩個版本畫面一致、語法、瀏覽器全流程測試、雲端版型別檢查
name: 自動檢查

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: 下載即用版
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 準備瀏覽器（優先用 GitHub 內建的 Chrome，不必另外下載）
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm test

  cloud:
    name: 雲端版
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler types
      - run: npx tsc --noEmit

  engine:
    name: AI 剪輯引擎
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -q -r engine/requirements.txt
      - run: python -m engine.tests.test_engine
