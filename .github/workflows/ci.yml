# 每次推送或開 PR 自動檢查：兩個版本畫面一致、語法、瀏覽器全流程測試、雲端版型別檢查
name: 自動檢查

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: 下載即用版
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  cloud:
    name: 雲端版
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler types
      - run: npx tsc --noEmit
