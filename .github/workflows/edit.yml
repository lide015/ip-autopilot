# AI 音樂剪輯：用「AI 音樂剪輯」表單開需求 → 雲端電腦剪好 → 成品放到 Releases 並自動留言連結。
# 留言「重跑」可重做；可加「從 1:20 開始」「換成 Live」。說明見 docs/MUSIC-ENGINE.md
name: AI 音樂剪輯

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: edit-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  edit:
    # 只處理「剪輯」需求，而且只有倉庫擁有者或協作者能啟動（避免陌生人用掉你的運算時數）
    if: >-
      startsWith(github.event.issue.title, '[剪輯]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      (github.event_name == 'issues' ||
       (contains(github.event.comment.body, '重跑') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6

      - name: 告訴使用者開始了
        run: gh issue comment "$ISSUE" --body "收到，開始剪輯 🎬 完成後會在這裡留言成品連結。（進度：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）"

      - name: 安裝剪輯工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -q -r engine/requirements.txt

      - name: 安裝 Demucs（有勾精準人聲分離才裝）
        if: contains(github.event.issue.body, '要（比較慢')
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q demucs

      - name: 剪輯
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUT_DIR: out
        run: python -m engine job

      - name: 發佈成品並留言
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('out/status.json'))['ok'] else 1)"; then
            TAG="edit-${ISSUE}-${{ github.run_id }}"
            gh release create "$TAG" out/*.mp4 out/*.jpg out/*.md $(ls out/*.srt 2>/dev/null) \
              --title "剪輯 #${ISSUE}" --notes-file out/report.md --latest=false
            URL=$(gh release view "$TAG" --json url -q .url)
            python -m engine comment out "$URL" > comment.md
          else
            cp out/report.md comment.md
          fi
          gh issue comment "$ISSUE" --body-file comment.md

      - name: 失敗時通知
        if: failure()
        run: gh issue comment "$ISSUE" --body "剪輯過程出錯了 😥 請打開這個連結看原因：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} 。修正後留言「重跑」。"
